[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "micropython-expert"
version = "0.1.0"
description = "Fine-tuned MicroPython expert model for code review and guidance"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Andrew Leech"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "datasets>=2.16.0",
    "accelerate>=0.26.0",
    "peft>=0.8.0",
    "trl>=0.7.0",
    "bitsandbytes>=0.42.0",
    "sentencepiece>=0.1.99",
    "tiktoken>=0.5.0",
    "click>=8.0.0",
    "tqdm>=4.66.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "markdownify>=0.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
quantize = [
    "auto-gptq>=0.7.0",
    "autoawq>=0.2.0",
]
serve = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
]

[project.scripts]
mpy-expert = "inference.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*", "training*", "inference*"]

[tool.ruff]
line-length = 99
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
