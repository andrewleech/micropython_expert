# Supervised Fine-Tuning Configuration for MicroPython Expert Model
# Target: RTX 8000 (48GB VRAM)

# Model
model_name: Qwen/Qwen2.5-Coder-7B-Instruct
output_dir: ./models/micropython-expert-7b

# Training hyperparameters
num_train_epochs: 3
per_device_train_batch_size: 4    # QLoRA uses much less memory
gradient_accumulation_steps: 8    # Effective batch size: 32
learning_rate: 2.0e-5
lr_scheduler_type: cosine
warmup_ratio: 0.1
weight_decay: 0.01
max_grad_norm: 1.0

# Sequence length
max_seq_length: 2048              # 99.2% of examples fit; saves significant VRAM

# QLoRA - 4-bit quantization with LoRA adapters
# Standard approach for 7B+ models, quality matches full fine-tuning for SFT
use_qlora: true
lora_r: 64            # LoRA rank
lora_alpha: 128       # LoRA alpha (scaling)
lora_dropout: 0.05
packing: false                    # Don't pack sequences (preserves example boundaries)

# Memory optimization for 48GB VRAM
gradient_checkpointing: true
bf16: true
tf32: false                       # TF32 requires Ampere+ (RTX 8000 is Turing)

# Checkpointing and saving
save_strategy: steps
save_steps: 500
save_total_limit: 3
evaluation_strategy: steps
eval_steps: 500
logging_steps: 10
report_to: tensorboard

# Resume capability
resume_from_checkpoint: true      # Auto-resume from latest checkpoint

# Data loading
dataloader_num_workers: 4
dataloader_pin_memory: true

# Dataset weights (applied during merging)
# These are reference values - actual weighting done in data preparation
dataset_weights:
  reviews_sft: 1.0
  wiki_qa: 1.2
  codebase_qa: 1.5
  app_dev_qa: 1.0

# Validation
per_device_eval_batch_size: 8
